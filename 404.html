<!doctype html>
<meta charset="utf-8">
<title>Ascension Experience Society</title>
<script>
  const base = '/ascension-frontend';
  const path = location.pathname.startsWith(base) ? location.pathname.slice(base.length) : location.pathname;
  const isAdmin = path.startsWith('/admin');
  const appBase = isAdmin ? base + '/admin/' : base + '/';
  const route = isAdmin ? path.replace(/^\/admin/, '') || '/dashboard' : path || '/';
  location.replace(appBase + '?route=' + encodeURIComponent(route) + location.hash);
</script>
